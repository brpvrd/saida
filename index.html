<style>

  html, body {
    margin: 0; height: 100%; overflow: hidden;

  #vista {

  h1 {
    margin: 0; font-size: 13px; font-weight: 800;
    letter-spacing: .16em; text-transform: uppercase; line-height: 1.2;
  }
  header p { margin: 4px 0 0; font-size: 11px; color: var(--suave); }
  #dica {
    position: fixed; left: 10px; bottom: 10px; right: 10px; z-index: 2;
    font-size: 11px; color: var(--suave); pointer-events: none;
    text-shadow: 0 0 6px #000, 0 0 3px #000;
  }
  :focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
</style>

  const imgs = FOTOS.map((nome, i) => {

  let kFit = 1;
  const kMax = () => 1700 / TW;               // quadro com ~1700 px de largura na tela

    const nk = clampK(base.k * fator);
    const r = nk / base.k;
    return { x: px - (px - base.x) * r, y: py - (py - base.y) * r, k: nk };
  }

  let anim = 0;
  function irPara(alvo, ms = 320) {
    cancelAnimationFrame(anim);
    if (reduzMovimento || ms === 0) { ({ x, y, k } = alvo); aplicar(); return; }
    const ini = { x, y, k }, t0 = performance.now();
    const passo = t => {
      const p = Math.min((t - t0) / ms, 1), e = 1 - Math.pow(1 - p, 3);
      // interpola o zoom de forma geométrica para ficar natural
      k = ini.k * Math.pow(alvo.k / ini.k, e);
      x = ini.x + (alvo.x - ini.x) * e;
      y = ini.y + (alvo.y - ini.y) * e;
      aplicar();
      if (p < 1) anim = requestAnimationFrame(passo);
    };
    anim = requestAnimationFrame(passo);
  }

  // ---------- resolução: troca miniatura por foto grande quando ampliada ----------
  let timer = 0;
  function agendarResolucao() { clearTimeout(timer); timer = setTimeout(atualizarResolucao, 140); }
  function atualizarResolucao() {
    const vw = innerWidth, vh = innerHeight;
    imgs.forEach((im, i) => {
      const r = im.getBoundingClientRect();
      const visivel = r.right > -50 && r.left < vw + 50 && r.bottom > -50 && r.top < vh + 50;
      if (visivel && r.width > 170) {
        if (im.dataset.alta !== '1') {
          im.dataset.alta = '1';
          const grande = new Image();
          grande.onload = () => { if (im.dataset.alta === '1') im.src = grande.src; };
          grande.src = 'grande/' + FOTOS[i];
        }
      } else if (im.dataset.alta === '1' && (!visivel || r.width < 120)) {
        im.dataset.alta = '0';
        im.src = 'mini/' + FOTOS[i];
      }
    });
  }

  // ---------- ponteiros: arrastar, pinça e toque duplo ----------
  const ponteiros = new Map();
  let moveu = false, pinca = null, ultimoToque = null;

  vista.addEventListener('pointerdown', e => {
    vista.setPointerCapture(e.pointerId);
    ponteiros.set(e.pointerId, { x: e.clientX, y: e.clientY, x0: e.clientX, y0: e.clientY });
    cancelAnimationFrame(anim);
    if (ponteiros.size === 1) moveu = false;
    if (ponteiros.size === 2) { moveu = true; iniciarPinca(); }
    vista.classList.add('arrastando');
  });

  vista.addEventListener('pointermove', e => {
    const p = ponteiros.get(e.pointerId);
    if (!p) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    if (Math.hypot(e.clientX - p.x0, e.clientY - p.y0) > 6) moveu = true;
    if (ponteiros.size === 1) {
      x += dx; y += dy; aplicar();
    } else if (ponteiros.size === 2 && pinca) {
      const [a, b] = [...ponteiros.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      const cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2;
      const nk = clampK(pinca.k * d / pinca.d);
      const r = nk / pinca.k;
      x = cx - (pinca.cx - pinca.x) * r;
      y = cy - (pinca.cy - pinca.y) * r;
      k = nk; aplicar();
    }
  });

  function iniciarPinca() {
    const [a, b] = [...ponteiros.values()];
    pinca = { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2, x, y, k };
  }

  function soltar(e) {
    const p = ponteiros.get(e.pointerId);
    if (!p) return;
    ponteiros.delete(e.pointerId);
    pinca = null;
    if (ponteiros.size === 1) {               // sobrou um dedo: recomeça o arraste dele
      const r = [...ponteiros.values()][0]; r.x0 = r.x; r.y0 = r.y;
    }
    if (ponteiros.size === 0) {
      vista.classList.remove('arrastando');
      if (e.type === 'pointerup' && !moveu) tocar(e);
    }
  }
  vista.addEventListener('pointerup', soltar);
  vista.addEventListener('pointercancel', soltar);

  // toque duplo / duplo clique: aproxima no ponto; se já estiver bem perto, volta à visão geral
  function tocar(e) {
    const agora = performance.now();
    if (ultimoToque && agora - ultimoToque.t < 320 && Math.hypot(e.clientX - ultimoToque.x, e.clientY - ultimoToque.y) < 28) {
      ultimoToque = null;
      if (k > kFit * 6) irPara(enquadrar());
      else irPara(zoomEm(e.clientX, e.clientY, 3));
    } else {
      ultimoToque = { t: agora, x: e.clientX, y: e.clientY };
    }
  }

  // ---------- roda do mouse ----------
  vista.addEventListener('wheel', e => {
    e.preventDefault();
    cancelAnimationFrame(anim);
    const unidade = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? 400 : 1;
    const fator = Math.exp(-e.deltaY * unidade * 0.0016);
    ({ x, y, k } = zoomEm(e.clientX, e.clientY, fator));
    aplicar();
  }, { passive: false });

  // ---------- teclado ----------
  addEventListener('keydown', e => {
    const cx = innerWidth / 2, cy = innerHeight / 2, passo = 80;
    switch (e.key) {
      case '0': irPara(enquadrar()); break;
      case '+': case '=': irPara(zoomEm(cx, cy, 1.6), 200); break;
      case '-': case '_': irPara(zoomEm(cx, cy, 1 / 1.6), 200); break;
      case 'ArrowLeft':  irPara({ x: x + passo, y, k }, 120); break;
      case 'ArrowRight': irPara({ x: x - passo, y, k }, 120); break;
      case 'ArrowUp':    irPara({ x, y: y + passo, k }, 120); break;
      case 'ArrowDown':  irPara({ x, y: y - passo, k }, 120); break;
      default: return;
    }
    e.preventDefault();
  });

  addEventListener('resize', () => { const antes = kFit; enquadrar(); if (k <= antes * 1.01) irPara(enquadrar(), 0); });

  // ---------- dica de uso ----------
  document.getElementById('dica').textContent = matchMedia('(pointer: coarse)').matches
    ? 'Arraste para percorrer · pince para zoom · toque duas vezes para aproximar'
    : 'Arraste para percorrer · roda do mouse para zoom · duplo clique para aproximar · tecla 0 para ver tudo';

  // ---------- início ----------
  const inicio = enquadrar();
  x = inicio.x; y = inicio.y; k = inicio.k;
  aplicar();
})();
</script>
</body>
</html>
